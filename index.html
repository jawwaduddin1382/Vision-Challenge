<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Chalange</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="game__header--box">
        <h1 class="game__header">Vision Chalange</h1>
    </header>
    
    <main class="game__bord">
        <div class="best__score--box">
            <h2 class="best__score">0</h2>
            <h2 class="score-text best-text">Best</h2>
        </div>
        <div class="game__container">
            <div class="gameover">Start Game!</div>
        </div>
        <div class="score__box">
            <h2 class="score">0</h2>
            <h2 class="score-text">Score</h2>
        </div>
    </main>
    <div class="game__btn">
        <button class="pass__btn" >Skip(3)</button>
        <h2 class="time">60</h2>
        <button class="restart__btn">Restart</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
